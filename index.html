<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <p>Wishing you all the joy and happiness.</p>
    </div>

    <!-- balloon layer -->
    <div id="balloons"></div>

    <!-- slideshow with various animations -->
    <div id="slideshow">
        <div class="slide active">🎈 Floating balloon fun!</div>
        <div class="slide">🕯️ Make a wish!</div>
        <div class="slide">🍰 Let's eat cake!</div>
        <div class="slide">🎊 Party time!</div>
    </div>

    <div id="confetti"></div>

    <audio id="birthday-audio" autoplay loop>
        <source src="audio/happy-birthday.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script src="script.js"></script>
</body>
</html>
